name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# NOTE: 0.15.2 n'est pas encore publiée sur ziglang.org (404 sur mlugg/setup-zig).
# On utilise `master` tant que la version stable n'est pas dispo.
# Dès que 0.15.2 (ou 0.15.3) est publiée, changer `version:` ci-dessous.
env:
  ZIG_VERSION: 0.15.2

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig (${{ env.ZIG_VERSION }})
        uses: mlugg/setup-zig@v1
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libtree-sitter-dev tcc

      - name: Build (no network)
        run: zig build -Dnetwork=false

      - name: Run unit tests (no network)
        run: zig build -Dnetwork=false test

      - name: Run functional test suite (no network)
        run: zig build -Dnetwork=false run -- --run-test core/test_suite.hvn
