name: CI

on:
  push:
    branches: [main]
  pull_request:
     branches: [main]
  workflow_dispatch:    # manuel uniquement

env:
  ZIG_VERSION: 0.15.2
  HEAVEN_NO_LEAK_CHECK: "1"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Zig build artifacts
        uses: actions/cache@v4
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: ${{ runner.os }}-zig-${{ hashFiles('build.zig', 'build.zig.zon') }}-${{ hashFiles('src/**/*.zig') }}
          restore-keys: |
            ${{ runner.os }}-zig-${{ hashFiles('build.zig', 'build.zig.zon') }}-
            ${{ runner.os }}-zig-

      - name: Install Zig
        run: |
          cd /tmp
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" -o zig.tar.xz
          tar -xf zig.tar.xz
          sudo mv "zig-x86_64-linux-${ZIG_VERSION}" /opt/zig
          sudo ln -sf /opt/zig/zig /usr/local/bin/zig
          zig version

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libtree-sitter-dev tcc

      - name: Install wasmtime
        run: |
          curl https://wasmtime.dev/install.sh -sSf | bash
          echo "$HOME/.wasmtime/bin" >> $GITHUB_PATH

      - name: Prepare vendor + build (native + wasm)
        run: bash build.sh

      - name: Run unit tests (no network)
        env:
          HEAVEN_STRICT_QBE: "1"
        run: zig build -Dnetwork=false test

      - name: Run functional test suite
        run: zig build -Dnetwork=false run -- --run-test core/test_suite.hvn

      - name: Run Heaven regression suite (core/test_suite.hvn)
        run: zig build -Dnetwork=false test-regression

      - name: Run multi-file test suites (tests/*.hvn, incl. verify_book.hvn)
        run: zig build -Doptimize=ReleaseFast -Dnetwork=false test-files

      - name: Check doc freshness (docgen --check)
        run: python3 scripts/docgen.py --check  # equivalent: zig build docgen-check

      - name: Doctest book (warn-only, 6 residus connus)
        run: python3 scripts/doctest.py --warn-only

      - name: Check STATUS.md freshness (status_gen --check)
        run: python3 scripts/status_gen.py --check
  vfs-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: No .bak files tracked
        run: |
          if git ls-files | grep -E '\.bak'; then
            echo "::error::tracked .bak files (should not be committed):"
            git ls-files | grep -E '\.bak'
            exit 1
          fi

      - name: Generate book_suite.hvn (gitignored, needed by vfs_manifest)
        run: bash tools/extract_book_tests.sh

      - name: vfs_manifest entries must exist on disk
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          m = json.load(open('src/vessel/public/vfs_manifest.json'))
          missing = [e for e in m if not pathlib.Path(e).is_file()]
          if missing:
              for e in missing:
                  print(f"::error::manifest entry missing on disk: {e}")
              sys.exit(1)
          print(f"OK: {len(m)} entries, all present")
          PY
