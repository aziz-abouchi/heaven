name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig 0.15.2
        uses: mlugg/setup-zig@v1
        with:
          version: 0.15.2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libtree-sitter-dev tcc

      - name: Set CC for tree-sitter CLI commands
        run: echo "CC=gcc" >> "$GITHUB_ENV"

      - name: Build (native)
        run: zig build

      - name: Run unit tests
        run: zig build test

      - name: Run functional test suite
        run: zig build run -- --run-test core/test_suite.hvn
