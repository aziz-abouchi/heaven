name: Deploy Book & WASM REPL

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Zig
        run: |
          cd /tmp
          curl -fsSL "https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz" -o zig.tar.xz
          tar -xf zig.tar.xz
          sudo mv "zig-x86_64-linux-0.15.2" /opt/zig
          sudo ln -sf /opt/zig/zig /usr/local/bin/zig
          zig version

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libtree-sitter-dev tcc

      - name: Install mdBook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.40/mdbook-v0.4.40-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build WASM
        run: |
          zig build -Dtarget=wasm32-freestanding -Doptimize=ReleaseSmall
          ls -la zig-out/bin/

      - name: Build mdBook
        run: mdbook build docs/book

      - name: Assemble site
        run: |
          mkdir -p site/repl
          cp -r docs/book/book/* site/
          cp -r src/vessel/public/* site/repl/
          cp zig-out/bin/heaven-freestanding.wasm site/repl/heaven.wasm
          # Le REPL Vessel remplace l'index du dossier /repl/
          cp src/vessel/public/repl.html site/repl/index.html
          ls -la site/repl/

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
