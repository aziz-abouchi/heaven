<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="monospace" font-size="13">
  <defs>
    <marker id="ar2" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/></marker>
  </defs>

  <text x="450" y="28" text-anchor="middle" font-size="17" font-weight="bold">eval ↔ apply : de Scheme (1985) à Heaven (2026)</text>
  <text x="450" y="50" text-anchor="middle" font-size="12" fill="#666">Même architecture mutuellement récursive, deux représentations</text>

  <!-- Colonne gauche : SICP -->
  <rect x="30" y="80" width="400" height="370" rx="8" fill="#fef9e7" stroke="#b7950b" stroke-width="2"/>
  <text x="230" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#7d6608">SICP ch. 4.1</text>

  <rect x="70" y="130" width="320" height="120" rx="6" fill="#fff" stroke="#b7950b" stroke-width="1.5"/>
  <text x="230" y="152" text-anchor="middle" font-weight="bold">eval : (exp, env) → value</text>
  <text x="90" y="175" font-size="11">cond sur la syntaxe :</text>
  <text x="90" y="192" font-size="11" fill="#666">self-eval → exp</text>
  <text x="90" y="208" font-size="11" fill="#666">variable → lookup env</text>
  <text x="90" y="224" font-size="11" fill="#666">application → (apply (eval op) args)</text>
  <text x="90" y="240" font-size="11" fill="#666">special forms → cas dédiés</text>

  <rect x="70" y="300" width="320" height="120" rx="6" fill="#fff" stroke="#b7950b" stroke-width="1.5"/>
  <text x="230" y="322" text-anchor="middle" font-weight="bold">apply : (proc, args) → value</text>
  <text x="90" y="345" font-size="11">cond sur la procédure :</text>
  <text x="90" y="362" font-size="11" fill="#666">primitive → apply-primitive</text>
  <text x="90" y="378" font-size="11" fill="#666">compound → (eval-sequence body env')</text>
  <text x="90" y="394" font-size="11" fill="#666">  avec env' = extend-env(params, args, env)</text>

  <path d="M 130,250 Q 80,275 130,300" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#ar2)"/>
  <path d="M 330,300 Q 380,275 330,250" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#ar2)"/>
  <text x="60" y="280" font-size="11" fill="#333">appel</text>
  <text x="355" y="280" font-size="11" fill="#333">retour</text>

  <!-- Colonne droite : Heaven -->
  <rect x="470" y="80" width="400" height="370" rx="8" fill="#eafaf1" stroke="#1e8449" stroke-width="2"/>
  <text x="670" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#145a32">Heaven</text>

  <rect x="510" y="130" width="320" height="120" rx="6" fill="#fff" stroke="#1e8449" stroke-width="1.5"/>
  <text x="670" y="152" text-anchor="middle" font-weight="bold">eval : Id → Engine!Id</text>
  <text x="530" y="175" font-size="11">tag du Store :</text>
  <text x="530" y="192" font-size="11" fill="#666">.lit → self</text>
  <text x="530" y="208" font-size="11" fill="#666">.sym → resolve(env) | magic</text>
  <text x="530" y="224" font-size="11" fill="#666">.apply → (apply (eval func) args)</text>
  <text x="530" y="240" font-size="11" fill="#666">.bind/.lambda/.letrec → spécial</text>

  <rect x="510" y="300" width="320" height="120" rx="6" fill="#fff" stroke="#1e8449" stroke-width="1.5"/>
  <text x="670" y="322" text-anchor="middle" font-weight="bold">apply : Id, [Id] → Engine!Id</text>
  <text x="530" y="345" font-size="11">kind de la valeur :</text>
  <text x="530" y="362" font-size="11" fill="#666">native (n) → call natif</text>
  <text x="530" y="378" font-size="11" fill="#666">closure → extend + eval(body)</text>
  <text x="530" y="394" font-size="11" fill="#666">  QTT : filtre les args erased</text>

  <path d="M 570,250 Q 520,275 570,300" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#ar2)"/>
  <path d="M 770,300 Q 820,275 770,250" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#ar2)"/>

  <!-- Notes communes -->
  <text x="230" y="440" text-anchor="middle" font-size="11" fill="#666" font-style="italic">égalité structurelle : ad-hoc</text>
  <text x="670" y="440" text-anchor="middle" font-size="11" fill="#666" font-style="italic">égalité structurelle : gratuite (hash-consing)</text>
</svg>
