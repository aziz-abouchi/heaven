<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 340" font-family="Georgia, serif">
  <rect width="500" height="340" fill="#faf7f2"/>
  <text x="250" y="30" text-anchor="middle" font-size="14" font-style="italic" fill="#2c2c2c">
    Le triangle de Frege (Sinn und Bedeutung, 1892)
  </text>
  <!-- Triangle -->
  <polygon points="250,80 100,260 400,260" fill="none" stroke="#2c2c2c" stroke-width="1.5"/>
  <!-- Sommet : signe -->
  <text x="250" y="70" text-anchor="middle" font-size="14" font-style="italic" fill="#2c2c2c">
    Signe
  </text>
  <text x="250" y="90" text-anchor="middle" font-size="11" fill="#7a3b3b">
    « 42 »
  </text>
  <!-- Bas gauche : sens -->
  <text x="100" y="285" text-anchor="middle" font-size="14" font-style="italic" fill="#2c2c2c">
    Sens
  </text>
  <text x="100" y="305" text-anchor="middle" font-size="10" fill="#7a3b3b">
    le concept d'entier
  </text>
  <text x="100" y="320" text-anchor="middle" font-size="9" fill="#666">(Sinn)</text>
  <!-- Bas droit : référence -->
  <text x="400" y="285" text-anchor="middle" font-size="14" font-style="italic" fill="#2c2c2c">
    Référence
  </text>
  <text x="400" y="305" text-anchor="middle" font-size="10" fill="#7a3b3b">
    le nombre 42
  </text>
  <text x="400" y="320" text-anchor="middle" font-size="9" fill="#666">(Bedeutung)</text>
  <!-- Flèches internes -->
  <text x="160" y="180" font-size="10" fill="#666" font-style="italic">désigne</text>
  <text x="320" y="180" font-size="10" fill="#666" font-style="italic">exprime</text>
  <!-- Phrase -->
  <text x="250" y="200" text-anchor="middle" font-size="10" fill="#2c2c2c">
    « L'étoile du matin » et « l'étoile du soir »
  </text>
  <text x="250" y="215" text-anchor="middle" font-size="10" fill="#2c2c2c">
    ont la même référence (Vénus), mais un sens différent.
  </text>
  <text x="250" y="240" text-anchor="middle" font-size="10" fill="#7a3b3b" font-style="italic">
    Idem : « 42 » et « 6 × 7 » désignent le même nombre.
  </text>
</svg>
