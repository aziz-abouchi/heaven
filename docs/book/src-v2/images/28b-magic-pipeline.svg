<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>
  <text x="320" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">expand / integrate / solve — pipeline runtime</text>
  <rect x="20" y="100" width="130" height="60" fill="#e3f2fd" stroke="#1976d2" stroke-width="2" rx="6"/>
  <text x="85" y="125" text-anchor="middle" font-family="monospace" font-size="14" fill="#0d47a1">"x^2"</text>
  <text x="85" y="145" text-anchor="middle" font-size="11" fill="#555">input string</text>
  <line x1="150" y1="130" x2="210" y2="130" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="210" y="100" width="160" height="60" fill="#fff3e0" stroke="#f57c00" stroke-width="2" rx="6"/>
  <text x="290" y="125" text-anchor="middle" font-family="monospace" font-size="14" fill="#e65100">integrateId</text>
  <text x="290" y="145" text-anchor="middle" font-size="11" fill="#555">vtable (heaven_expr)</text>
  <line x1="370" y1="130" x2="430" y2="130" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="430" y="100" width="190" height="60" fill="#e8f5e9" stroke="#388e3c" stroke-width="2" rx="6"/>
  <text x="525" y="125" text-anchor="middle" font-family="monospace" font-size="13" fill="#1b5e20">(/ (^ x 3) 3)</text>
  <text x="525" y="145" text-anchor="middle" font-size="11" fill="#555">result AST (infix)</text>
  <text x="320" y="200" text-anchor="middle" font-size="11" fill="#666">string -> magic (vtable) -> AST -> formatInfix -> string</text>
  <text x="320" y="225" text-anchor="middle" font-size="11" fill="#666" font-family="monospace">echo 'integrate(x^2)' | heaven --eval-file /dev/stdin</text>
</svg>
