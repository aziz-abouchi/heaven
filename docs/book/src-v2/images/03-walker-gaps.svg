  <text x="60" y="310" font-size="12" font-weight="bold">Diagnostic</text>
  <text x="60" y="332" font-size="11" fill="#333">• Bridge.buildFile traite tree-sitter ; quand tree-sitter échoue</text>
  <text x="60" y="348" font-size="11" fill="#333">  sur `data X a = …`, les clauses suivantes ne deviennent jamais</text>
  <text x="60" y="364" font-size="11" fill="#333">  des `bind` dans roots → le walker les voit unbound.</text>
  <text x="60" y="388" font-size="11" fill="#333">• Le walker lui-même a été mesuré : 6/6 unitaires verts, 0</text>
  <text x="60" y="404" font-size="11" fill="#333">  faux positif après filtre ERROR + alias (349 → 269, delta 80).</text>

  <text x="450" y="440" text-anchor="middle" font-size="11" fill="#666" font-style="italic">Source : docs/spec/_unbound_walker_gaps.md · 2026-11-10</text>
