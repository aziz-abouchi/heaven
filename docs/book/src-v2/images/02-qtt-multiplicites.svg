<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" font-family="Georgia, serif">
  <rect width="500" height="320" fill="#faf7f2"/>
  <text x="250" y="30" text-anchor="middle" font-size="14" font-style="italic" fill="#2c2c2c">
    Les trois multiplicites QTT
  </text>

  <!-- 0 efface -->
  <g>
    <rect x="30" y="70" width="130" height="180" fill="#f0e8e8" stroke="#2c2c2c" stroke-width="1.5"/>
    <text x="95" y="105" text-anchor="middle" font-size="28" fill="#7a3b3b" font-family="monospace">0</text>
    <text x="95" y="130" text-anchor="middle" font-size="12" fill="#2c2c2c" font-style="italic">efface</text>
    <line x1="55" y1="150" x2="135" y2="150" stroke="#666" stroke-width="0.5"/>
    <text x="95" y="175" text-anchor="middle" font-size="11" fill="#2c2c2c">jamais utilise</text>
    <text x="95" y="195" text-anchor="middle" font-size="11" fill="#2c2c2c">0 octet runtime</text>
    <text x="95" y="225" text-anchor="middle" font-size="10" fill="#666" font-style="italic">preuves, types,</text>
    <text x="95" y="238" text-anchor="middle" font-size="10" fill="#666" font-style="italic">annotations</text>
  </g>

  <!-- 1 lineaire -->
  <g>
    <rect x="185" y="70" width="130" height="180" fill="#e8f0e8" stroke="#2c2c2c" stroke-width="1.5"/>
    <text x="250" y="105" text-anchor="middle" font-size="28" fill="#7a3b3b" font-family="monospace">1</text>
    <text x="250" y="130" text-anchor="middle" font-size="12" fill="#2c2c2c" font-style="italic">lineaire</text>
    <line x1="210" y1="150" x2="290" y2="150" stroke="#666" stroke-width="0.5"/>
    <text x="250" y="175" text-anchor="middle" font-size="11" fill="#2c2c2c">exactement 1 fois</text>
    <text x="250" y="195" text-anchor="middle" font-size="11" fill="#2c2c2c">proprietaire unique</text>
    <text x="250" y="225" text-anchor="middle" font-size="10" fill="#666" font-style="italic">libe&shy;ration</text>
    <text x="250" y="238" text-anchor="middle" font-size="10" fill="#666" font-style="italic">deterministe</text>
  </g>

  <!-- omega libre -->
  <g>
    <rect x="340" y="70" width="130" height="180" fill="#e8e8f0" stroke="#2c2c2c" stroke-width="1.5"/>
    <text x="405" y="105" text-anchor="middle" font-size="28" fill="#7a3b3b" font-family="monospace">&#969;</text>
    <text x="405" y="130" text-anchor="middle" font-size="12" fill="#2c2c2c" font-style="italic">libre</text>
    <line x1="365" y1="150" x2="445" y2="150" stroke="#666" stroke-width="0.5"/>
    <text x="405" y="175" text-anchor="middle" font-size="11" fill="#2c2c2c">0..n fois</text>
    <text x="405" y="195" text-anchor="middle" font-size="11" fill="#2c2c2c">regime habituel</text>
    <text x="405" y="225" text-anchor="middle" font-size="10" fill="#666" font-style="italic">partage,</text>
    <text x="405" y="238" text-anchor="middle" font-size="10" fill="#666" font-style="italic">recopie possible</text>
  </g>

  <!-- Note -->
  <text x="250" y="290" text-anchor="middle" font-size="10" fill="#666" font-style="italic">
    Girard (1987), Atkey (2018). Heaven V0 s'en inspire.
  </text>
</svg>
