<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 260" font-family="Georgia, serif">
  <rect width="500" height="260" fill="#faf7f2"/>
  <text x="250" y="30" text-anchor="middle" font-size="14" font-style="italic" fill="#2c2c2c">
    Emettre un signal, l'intercepter
  </text>
  <!-- Code pur -->
  <g>
    <rect x="30" y="80" width="180" height="80" fill="#fff" stroke="#2c2c2c" stroke-width="1"/>
    <text x="120" y="105" text-anchor="middle" font-size="11" fill="#7a3b3b" font-style="italic">Code pur</text>
    <text x="120" y="130" text-anchor="middle" font-size="13" fill="#2c2c2c">perform "Log" 42</text>
    <text x="120" y="150" text-anchor="middle" font-size="10" fill="#666">emet un signal,</text>
    <text x="120" y="163" text-anchor="middle" font-size="10" fill="#666">ne fait rien d'autre</text>
  </g>
  <!-- Fleche -->
  <g>
    <line x1="220" y1="120" x2="290" y2="120" stroke="#7a3b3b" stroke-width="1.5" marker-end="url(#ah)"/>
    <text x="255" y="110" text-anchor="middle" font-size="10" fill="#7a3b3b" font-style="italic">signal</text>
  </g>
  <!-- Handler -->
  <g>
    <rect x="300" y="80" width="170" height="80" fill="#fff" stroke="#2c2c2c" stroke-width="1"/>
    <text x="385" y="105" text-anchor="middle" font-size="11" fill="#7a3b3b" font-style="italic">Handler</text>
    <text x="385" y="130" text-anchor="middle" font-size="13" fill="#2c2c2c">logHandler 42</text>
    <text x="385" y="150" text-anchor="middle" font-size="10" fill="#666">donne un sens</text>
    <text x="385" y="163" text-anchor="middle" font-size="10" fill="#666">au signal</text>
  </g>
  <!-- Resultat -->
  <text x="250" y="210" text-anchor="middle" font-size="13" fill="#2c2c2c">
    handle (perform "Log" 42) logHandler
  </text>
  <text x="250" y="235" text-anchor="middle" font-size="14" fill="#7a3b3b">
    = 142
  </text>
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#7a3b3b"/>
    </marker>
  </defs>
</svg>
