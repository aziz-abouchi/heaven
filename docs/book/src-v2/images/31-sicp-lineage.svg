<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="monospace" font-size="13">
  <text x="450" y="28" text-anchor="middle" font-size="17" font-weight="bold">Lignée SICP → Heaven</text>
  <text x="450" y="50" text-anchor="middle" font-size="12" fill="#666">Chaque chapitre de SICP a un équivalent Heaven, avec des divergences assumées</text>

  <!-- Colonne gauche : SICP -->
  <rect x="30" y="80" width="380" height="410" rx="8" fill="#fef9e7" stroke="#b7950b" stroke-width="2"/>
  <text x="220" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#7d6608">SICP (1985)</text>

  <rect x="50" y="130" width="340" height="55" rx="4" fill="#fff" stroke="#b7950b"/>
  <text x="70" y="152" font-weight="bold">Ch. 1 — Procédures</text>
  <text x="70" y="172" font-size="11" fill="#666">square, higher-order, composition</text>

  <rect x="50" y="200" width="340" height="55" rx="4" fill="#fff" stroke="#b7950b"/>
  <text x="70" y="222" font-weight="bold">Ch. 2 — Données</text>
  <text x="70" y="242" font-size="11" fill="#666">cons, list, data as procedures</text>

  <rect x="50" y="270" width="340" height="55" rx="4" fill="#fff" stroke="#b7950b"/>
  <text x="70" y="292" font-weight="bold">Ch. 3 — État</text>
  <text x="70" y="312" font-size="11" fill="#666">set!, comptes, fermetures mutables</text>

  <rect x="50" y="340" width="340" height="55" rx="4" fill="#fff" stroke="#b7950b"/>
  <text x="70" y="362" font-weight="bold">Ch. 4 — Métalinguistique</text>
  <text x="70" y="382" font-size="11" fill="#666">eval/apply, analyze, amb</text>

  <rect x="50" y="410" width="340" height="55" rx="4" fill="#fff" stroke="#b7950b"/>
  <text x="70" y="432" font-weight="bold">Ch. 5 — Machines</text>
  <text x="70" y="452" font-size="11" fill="#666">registres, compilation explicite</text>

  <!-- Flèches -->
  <defs><marker id="ar" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/></marker></defs>
  <line x1="390" y1="157" x2="490" y2="157" stroke="#333" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="390" y1="227" x2="490" y2="227" stroke="#333" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="390" y1="297" x2="490" y2="297" stroke="#333" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="390" y1="367" x2="490" y2="367" stroke="#333" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="390" y1="437" x2="490" y2="437" stroke="#333" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Colonne droite : Heaven -->
  <rect x="490" y="80" width="380" height="410" rx="8" fill="#eafaf1" stroke="#1e8449" stroke-width="2"/>
  <text x="680" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#145a32">Heaven (2026)</text>

  <rect x="510" y="130" width="340" height="55" rx="4" fill="#fff" stroke="#1e8449"/>
  <text x="530" y="152" font-weight="bold">Ch. 1, 5, 6</text>
  <text x="530" y="172" font-size="11" fill="#666">+ HM inference + QTT</text>

  <rect x="510" y="200" width="340" height="55" rx="4" fill="#fff" stroke="#1e8449"/>
  <text x="530" y="222" font-weight="bold">Ch. 8, 10, 12</text>
  <text x="530" y="242" font-size="11" fill="#666">+ hash-consing (Store)</text>

  <rect x="510" y="270" width="340" height="55" rx="4" fill="#fff" stroke="#1e8449"/>
  <text x="530" y="292" font-weight="bold">Ch. 17, 18, 20, 21</text>
  <text x="530" y="312" font-size="11" fill="#666">− set! / + effects + actors</text>

  <rect x="510" y="340" width="340" height="55" rx="4" fill="#fff" stroke="#1e8449"/>
  <text x="530" y="362" font-weight="bold">Ch. 27, 28 + 31</text>
  <text x="530" y="382" font-size="11" fill="#666">+ QTT erasure (analyze) + effects (amb)</text>

  <rect x="510" y="410" width="340" height="55" rx="4" fill="#fff" stroke="#1e8449"/>
  <text x="530" y="432" font-weight="bold">MIR → QBE / WAT / WASM</text>
  <text x="530" y="452" font-size="11" fill="#666">src/backend/mir_*.zig</text>
</svg>
