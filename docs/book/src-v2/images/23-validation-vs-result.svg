<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" font-family="monospace">
  <rect width="800" height="350" fill="#0a0a0a"/>
  <text x="400" y="40" text-anchor="middle" fill="#00ff41" font-size="20">Result (sequentiel) vs Validation (accumulatif)</text>

  <!-- Result -->
  <rect x="60" y="80" width="320" height="230" fill="none" stroke="#00ff41" stroke-width="2"/>
  <text x="220" y="110" text-anchor="middle" fill="#00ff41" font-size="16">Result e a (Monad)</text>

  <circle cx="130" cy="150" r="15" fill="none" stroke="#00ff41" stroke-width="2"/>
  <text x="130" y="155" text-anchor="middle" fill="#00ff41" font-size="12">1</text>

  <circle cx="220" cy="150" r="15" fill="none" stroke="#ff4444" stroke-width="2"/>
  <text x="220" y="155" text-anchor="middle" fill="#ff4444" font-size="12">X</text>

  <circle cx="310" cy="150" r="15" fill="none" stroke="#444" stroke-width="2"/>
  <text x="310" y="155" text-anchor="middle" fill="#444" font-size="12">?</text>

  <line x1="145" y1="150" x2="205" y2="150" stroke="#00ff41" stroke-width="2"/>
  <line x1="235" y1="150" x2="295" y2="150" stroke="#444" stroke-width="2" stroke-dasharray="4 4"/>

  <text x="220" y="210" text-anchor="middle" fill="#ff4444" font-size="13">stop a la 1ere erreur</text>
  <text x="220" y="240" text-anchor="middle" fill="#888" font-size="12">etapes dependantes</text>
  <text x="220" y="270" text-anchor="middle" fill="#888" font-size="12">parser, evaluation</text>

  <!-- Validation -->
  <rect x="420" y="80" width="320" height="230" fill="none" stroke="#00ff41" stroke-width="2"/>
  <text x="580" y="110" text-anchor="middle" fill="#00ff41" font-size="16">Validation e a (Applicative)</text>

  <circle cx="490" cy="150" r="15" fill="none" stroke="#ff4444" stroke-width="2"/>
  <text x="490" y="155" text-anchor="middle" fill="#ff4444" font-size="12">X</text>

  <circle cx="580" cy="150" r="15" fill="none" stroke="#ff4444" stroke-width="2"/>
  <text x="580" y="155" text-anchor="middle" fill="#ff4444" font-size="12">X</text>

  <circle cx="670" cy="150" r="15" fill="none" stroke="#ff4444" stroke-width="2"/>
  <text x="670" y="155" text-anchor="middle" fill="#ff4444" font-size="12">X</text>

  <text x="580" y="210" text-anchor="middle" fill="#ff4444" font-size="13">3 erreurs accumulees</text>
  <text x="580" y="240" text-anchor="middle" fill="#888" font-size="12">verifications independantes</text>
  <text x="580" y="270" text-anchor="middle" fill="#888" font-size="12">formulaire, typechecker</text>

  <text x="400" y="330" text-anchor="middle" fill="#888" font-size="12">Bryan Lonsdorf : monade sequentielle vs applicatif accumulatif</text>
</svg>
