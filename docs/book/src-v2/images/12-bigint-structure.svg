<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 260" font-family="Georgia, serif">
  <rect width="500" height="260" fill="#faf7f2"/>
  <text x="250" y="30" text-anchor="middle" font-size="14" font-style="italic" fill="#2c2c2c">
    Un BigInt est une liste de chiffres
  </text>
  <!-- Signe -->
  <g>
    <rect x="40" y="80" width="60" height="80" fill="#fff" stroke="#2c2c2c" stroke-width="1.5"/>
    <text x="70" y="105" text-anchor="middle" font-size="11" fill="#7a3b3b" font-style="italic">signe</text>
    <text x="70" y="135" text-anchor="middle" font-size="16" fill="#2c2c2c">+</text>
  </g>
  <!-- Chiffres 1 2 3 -->
  <g>
    <rect x="120" y="80" width="60" height="80" fill="#fff" stroke="#2c2c2c" stroke-width="1.5"/>
    <text x="150" y="105" text-anchor="middle" font-size="11" fill="#7a3b3b" font-style="italic">chiffre</text>
    <text x="150" y="135" text-anchor="middle" font-size="20" fill="#2c2c2c">1</text>
  </g>
  <g>
    <rect x="200" y="80" width="60" height="80" fill="#fff" stroke="#2c2c2c" stroke-width="1.5"/>
    <text x="230" y="105" text-anchor="middle" font-size="11" fill="#7a3b3b" font-style="italic">chiffre</text>
    <text x="230" y="135" text-anchor="middle" font-size="20" fill="#2c2c2c">2</text>
  </g>
  <g>
    <rect x="280" y="80" width="60" height="80" fill="#fff" stroke="#2c2c2c" stroke-width="1.5"/>
    <text x="310" y="105" text-anchor="middle" font-size="11" fill="#7a3b3b" font-style="italic">chiffre</text>
    <text x="310" y="135" text-anchor="middle" font-size="20" fill="#2c2c2c">3</text>
  </g>
  <!-- Fin -->
  <g>
    <rect x="360" y="80" width="60" height="80" fill="#fff" stroke="#2c2c2c" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="390" y="105" text-anchor="middle" font-size="11" fill="#888" font-style="italic">fin</text>
    <text x="390" y="135" text-anchor="middle" font-size="16" fill="#888" font-style="italic">BNil</text>
  </g>
  <!-- Fleches -->
  <g fill="none" stroke="#2c2c2c" stroke-width="1.5">
    <path d="M 100 120 L 118 120"/>
    <path d="M 180 120 L 198 120"/>
    <path d="M 260 120 L 278 120"/>
    <path d="M 340 120 L 358 120"/>
  </g>
  <text x="250" y="205" text-anchor="middle" font-size="11" fill="#2c2c2c">
    BPos (BCons 1 (BCons 2 (BCons 3 BNil)))
  </text>
  <text x="250" y="240" text-anchor="middle" font-size="10" fill="#666" font-style="italic">
    Pas de limite sur la longueur : autant de chiffres qu'on veut.
  </text>
</svg>
