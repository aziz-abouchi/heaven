<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="monospace" font-size="13">
<defs><marker id="ar" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/></marker></defs>
<text x="450" y="26" text-anchor="middle" font-size="17" font-weight="bold">Noms qualifiés dans les branches d'un if</text>
<text x="450" y="46" text-anchor="middle" font-size="12" fill="#666">avant le fix 55430bf, un seul point corrompt les DEUX branches</text>
<rect x="20" y="70" width="410" height="400" rx="8" fill="#fdf2f2" stroke="#c0392b" stroke-width="2"/>
<text x="225" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">AVANT</text>
<text x="40" y="126" fill="#333">source :</text>
<text x="40" y="146" fill="#1a1a1a" font-weight="bold">find n = if (= n 0) then (R.Ok 1) else 2</text>
<line x1="40" y1="164" x2="410" y2="164" stroke="#c0392b" stroke-dasharray="3,3"/>
<text x="40" y="184" fill="#333">1. lex(R.Ok)</text>
<text x="60" y="202" fill="#666">-&gt; ident(R)</text>
<text x="60" y="220" fill="#c0392b">erreur de syntaxe sur le point</text>
<line x1="40" y1="238" x2="410" y2="238" stroke="#c0392b" stroke-dasharray="3,3"/>
<text x="40" y="258" fill="#333">2. fallback parseSExpr</text>
<text x="60" y="276" fill="#666">delegue a parseExpression(meme)</text>
<text x="60" y="294" fill="#c0392b">recursion -&gt; depth &gt; 500</text>
<line x1="40" y1="312" x2="410" y2="312" stroke="#c0392b" stroke-dasharray="3,3"/>
<text x="40" y="332" fill="#333">3. resultat</text>
<text x="60" y="350" fill="#666">sym(chaine brute)</text>
<text x="60" y="368" fill="#c0392b" font-weight="bold">find 0  -&gt;  inconnu</text>
<text x="60" y="386" fill="#c0392b" font-weight="bold">find 5  -&gt;  inconnu</text>
<text x="60" y="440" fill="#666" font-style="italic">les deux branches echouent</text>
<rect x="470" y="70" width="410" height="400" rx="8" fill="#f0f9f2" stroke="#27ae60" stroke-width="2"/>
<text x="675" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">APRES</text>
<text x="490" y="126" fill="#333">source :</text>
<text x="490" y="146" fill="#1a1a1a" font-weight="bold">find n = if (= n 0) then (R.Ok 1) else 2</text>
<line x1="490" y1="164" x2="860" y2="164" stroke="#27ae60" stroke-dasharray="3,3"/>
<text x="490" y="184" fill="#333">1. lex(R.Ok)</text>
<text x="510" y="202" fill="#666">-&gt; ident(R.Ok)</text>
<text x="510" y="220" fill="#27ae60">un seul token</text>
<line x1="490" y1="238" x2="860" y2="238" stroke="#27ae60" stroke-dasharray="3,3"/>
<text x="490" y="258" fill="#333">2. S-expr</text>
<text x="510" y="276" fill="#666">(if (= n 0) (R.Ok 1) 2)</text>
<text x="510" y="294" fill="#27ae60">arite 3 preservee</text>
<line x1="490" y1="312" x2="860" y2="312" stroke="#27ae60" stroke-dasharray="3,3"/>
<text x="490" y="332" fill="#333">3. resultat</text>
<text x="510" y="350" fill="#666">engine.eval</text>
<text x="510" y="368" fill="#27ae60" font-weight="bold">find 0  -&gt;  (R.Ok 1)</text>
<text x="510" y="386" fill="#27ae60" font-weight="bold">find 5  -&gt;  2</text>
<text x="510" y="440" fill="#666" font-style="italic">chaque branche suit son cours</text>
<line x1="440" y1="270" x2="470" y2="270" stroke="#333" stroke-width="2" marker-end="url(#ar)"/>
</svg>
