<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 220" font-family="Georgia, serif">
  <rect width="500" height="220" fill="#faf7f2"/>
  <text x="250" y="30" text-anchor="middle" font-size="14" font-style="italic" fill="#2c2c2c">
    La composition : (f >>> g)
  </text>
  <!-- Input -->
  <g>
    <text x="60" y="110" text-anchor="middle" font-size="18" fill="#2c2c2c">3</text>
  </g>
  <!-- Fleche 1 -->
  <g>
    <line x1="90" y1="105" x2="150" y2="105" stroke="#2c2c2c" stroke-width="1.5" marker-end="url(#a3)"/>
  </g>
  <!-- Boite f -->
  <g>
    <rect x="160" y="85" width="80" height="40" fill="#fff" stroke="#2c2c2c" stroke-width="1.5"/>
    <text x="200" y="110" text-anchor="middle" font-size="14" font-style="italic" fill="#7a3b3b">inc</text>
  </g>
  <!-- Fleche 2 -->
  <g>
    <line x1="250" y1="105" x2="310" y2="105" stroke="#2c2c2c" stroke-width="1.5" marker-end="url(#a3)"/>
  </g>
  <!-- Boite g -->
  <g>
    <rect x="320" y="85" width="80" height="40" fill="#fff" stroke="#2c2c2c" stroke-width="1.5"/>
    <text x="360" y="110" text-anchor="middle" font-size="14" font-style="italic" fill="#7a3b3b">dbl</text>
  </g>
  <!-- Fleche 3 -->
  <g>
    <line x1="410" y1="105" x2="450" y2="105" stroke="#2c2c2c" stroke-width="1.5" marker-end="url(#a3)"/>
  </g>
  <!-- Output -->
  <g>
    <text x="470" y="110" text-anchor="middle" font-size="18" fill="#2c2c2c">8</text>
  </g>
  <defs>
    <marker id="a3" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2c2c2c"/>
    </marker>
  </defs>
  <!-- Phrase -->
  <text x="250" y="170" text-anchor="middle" font-size="11" fill="#666" font-style="italic">
    « La composition est un tuyau : la sortie d'une boite devient l'entree de la suivante. »
  </text>
  <text x="250" y="195" text-anchor="middle" font-size="10" fill="#2c2c2c">
    (inc >>> dbl) 3 = dbl (inc 3) = dbl 4 = 8
  </text>
</svg>
