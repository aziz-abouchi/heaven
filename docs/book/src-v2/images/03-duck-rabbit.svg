<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" font-family="Georgia, serif">
  <rect width="500" height="300" fill="#faf7f2"/>
  <text x="250" y="30" text-anchor="middle" font-size="14" font-style="italic" fill="#2c2c2c">
    Le canard-lapin de Wittgenstein
  </text>
  <!-- Tete schematique (cercle + oreilles/bec) -->
  <g transform="translate(250,160)">
    <!-- contour de tete -->
    <ellipse cx="0" cy="0" rx="70" ry="55" fill="none" stroke="#2c2c2c" stroke-width="1.5"/>
    <!-- oreilles (aspect lapin) -->
    <path d="M -40 -45 Q -50 -90 -30 -95 Q -20 -60 -20 -45 Z" fill="none" stroke="#2c2c2c" stroke-width="1.5"/>
    <path d="M -15 -50 Q -20 -90 0 -95 Q 5 -60 0 -50 Z" fill="none" stroke="#2c2c2c" stroke-width="1.5"/>
    <!-- oeil commun -->
    <circle cx="20" cy="-10" r="3" fill="#2c2c2c"/>
    <!-- bec (aspect canard) ou museau (aspect lapin) -->
    <path d="M 50 -5 Q 90 -15 90 5 Q 50 15 50 5 Z" fill="none" stroke="#2c2c2c" stroke-width="1.5"/>
  </g>
  <!-- Annotations -->
  <text x="100" y="270" text-anchor="middle" font-size="11" font-style="italic" fill="#7a3b3b">aspect lapin</text>
  <text x="400" y="270" text-anchor="middle" font-size="11" font-style="italic" fill="#7a3b3b">aspect canard</text>
  <text x="250" y="290" text-anchor="middle" font-size="10" fill="#2c2c2c">
    « Je vois quelque chose comme quelque chose. »
  </text>
</svg>
