<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 260" font-family="monospace" font-size="13">
<defs><marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/></marker></defs>
<rect x="30" y="40" width="140" height="60" rx="6" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
<text x="100" y="70" text-anchor="middle" font-weight="bold">Client</text>
<text x="100" y="88" text-anchor="middle" font-size="11" fill="#555">!Req, ?Resp</text>
<rect x="330" y="40" width="140" height="60" rx="6" fill="#e8f8ee" stroke="#1e8e3e" stroke-width="2"/>
<text x="400" y="70" text-anchor="middle" font-weight="bold">Server</text>
<text x="400" y="88" text-anchor="middle" font-size="11" fill="#555">?Req, !Resp</text>
<line x1="170" y1="60" x2="330" y2="60" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="250" y="52" text-anchor="middle" font-size="12">Req</text>
<line x1="330" y1="85" x2="170" y2="85" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="250" y="103" text-anchor="middle" font-size="12">Resp</text>
<text x="250" y="150" text-anchor="middle" font-size="12" font-style="italic">trace client = "Req,Resp"</text>
<text x="250" y="170" text-anchor="middle" font-size="12" font-style="italic">trace serveur = "Req,Resp"</text>
<text x="250" y="210" text-anchor="middle" font-size="11" fill="#666">dual(!Req.?Resp) = ?Req.!Resp</text>
</svg>