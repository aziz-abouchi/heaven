<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" font-family="Georgia, serif">
  <rect width="500" height="320" fill="#faf7f2"/>
  <text x="250" y="30" text-anchor="middle" font-size="14" font-style="italic" fill="#2c2c2c">
    L'encodage van Laarhoven (Haskell)
  </text>

  <!-- Box noire -->
  <g>
    <rect x="120" y="80" width="260" height="100" fill="#fff" stroke="#2c2c2c" stroke-width="1.5"/>
    <text x="250" y="120" text-anchor="middle" font-size="11" fill="#2c2c2c" font-family="monospace">
      (a -&gt; f a) -&gt; (s -&gt; f s)
    </text>
    <text x="250" y="150" text-anchor="middle" font-size="10" fill="#666" font-style="italic">
      une lens est une fonction qui transforme
    </text>
    <text x="250" y="165" text-anchor="middle" font-size="10" fill="#666" font-style="italic">
      une modification sur a en modification sur s
    </text>
  </g>

  <!-- Reduction arrows -->
  <g>
    <path d="M 250 195 L 250 230" fill="none" stroke="#7a3b3b" stroke-width="1.5" marker-end="url(#arr15c)"/>
    <text x="275" y="218" font-size="10" fill="#7a3b3b" font-style="italic">reduction</text>
  </g>

  <!-- Equivalent -->
  <g>
    <rect x="60" y="240" width="170" height="55" fill="#d0e8c0" stroke="#2c2c2c" stroke-width="1"/>
    <text x="145" y="263" text-anchor="middle" font-size="11" fill="#2c2c2c" font-family="monospace">get : s -&gt; a</text>
    <text x="145" y="283" text-anchor="middle" font-size="10" fill="#666" font-style="italic">(V0 : fst)</text>

    <rect x="270" y="240" width="170" height="55" fill="#e8d0c0" stroke="#2c2c2c" stroke-width="1"/>
    <text x="355" y="263" text-anchor="middle" font-size="11" fill="#2c2c2c" font-family="monospace">set : a -&gt; s -&gt; s</text>
    <text x="355" y="283" text-anchor="middle" font-size="10" fill="#666" font-style="italic">(V0 : snd)</text>
  </g>

  <defs>
    <marker id="arr15c" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#7a3b3b"/>
    </marker>
  </defs>
</svg>
