<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 360" font-family="Georgia, serif">
  <rect width="500" height="360" fill="#faf7f2"/>
  <text x="250" y="30" text-anchor="middle" font-size="14" font-style="italic" fill="#2c2c2c">
    Un arbre de preuve : de haut en bas
  </text>
  <!-- Racine : theoreme -->
  <g>
    <rect x="150" y="60" width="200" height="40" fill="#fff" stroke="#2c2c2c" stroke-width="1.5"/>
    <text x="250" y="85" text-anchor="middle" font-size="12" fill="#2c2c2c">theorem t : x + 0 = x</text>
  </g>
  <!-- Etape 1 : simplify -->
  <g>
    <line x1="250" y1="100" x2="250" y2="130" stroke="#2c2c2c" stroke-width="1"/>
    <rect x="150" y="130" width="200" height="35" fill="#fff" stroke="#2c2c2c" stroke-width="1"/>
    <text x="250" y="152" text-anchor="middle" font-size="11" fill="#7a3b3b">by simplify</text>
  </g>
  <!-- Etape 2 : reduction -->
  <g>
    <line x1="250" y1="165" x2="250" y2="195" stroke="#2c2c2c" stroke-width="1"/>
    <text x="250" y="200" text-anchor="middle" font-size="11" fill="#2c2c2c">x + 0 -&gt; x</text>
  </g>
  <!-- Etape 3 : egalite -->
  <g>
    <line x1="250" y1="210" x2="250" y2="240" stroke="#2c2c2c" stroke-width="1"/>
    <text x="250" y="245" text-anchor="middle" font-size="11" fill="#2c2c2c">x = x</text>
  </g>
  <!-- Conclusion -->
  <g>
    <line x1="250" y1="255" x2="250" y2="285" stroke="#2c2c2c" stroke-width="1"/>
    <rect x="150" y="285" width="200" height="35" fill="#faf7f2" stroke="#7a3b3b" stroke-width="2"/>
    <text x="250" y="307" text-anchor="middle" font-size="12" fill="#7a3b3b">✓ proved</text>
  </g>
  <!-- Annotation -->
  <text x="250" y="345" text-anchor="middle" font-size="10" fill="#666" font-style="italic">
    Chaque etape est verifiee par le noyau.
  </text>
</svg>
