<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" font-family="Georgia, serif">
  <rect width="500" height="280" fill="#faf7f2"/>
  <text x="250" y="30" text-anchor="middle" font-size="14" font-style="italic" fill="#2c2c2c">
    Comment une connaissance devient du code
  </text>
  <!-- Knowledge -->
  <g>
    <rect x="40" y="90" width="160" height="100" fill="#fff" stroke="#2c2c2c" stroke-width="1.5"/>
    <text x="120" y="120" text-anchor="middle" font-size="12" font-style="italic" fill="#7a3b3b">Knowledge</text>
    <text x="120" y="145" text-anchor="middle" font-size="10" fill="#2c2c2c">Socrate est un homme</text>
    <text x="120" y="165" text-anchor="middle" font-size="10" fill="#666">(URI, provenance)</text>
  </g>
  <!-- Fleche lowering -->
  <g>
    <line x1="200" y1="140" x2="290" y2="140" stroke="#7a3b3b" stroke-width="2" marker-end="url(#al)"/>
    <text x="245" y="130" text-anchor="middle" font-size="10" fill="#7a3b3b" font-style="italic">lowering</text>
    <text x="245" y="160" text-anchor="middle" font-size="9" fill="#666">explicite</text>
  </g>
  <!-- Expr -->
  <g>
    <rect x="300" y="90" width="160" height="100" fill="#fff" stroke="#2c2c2c" stroke-width="1.5"/>
    <text x="380" y="120" text-anchor="middle" font-size="12" font-style="italic" fill="#7a3b3b">Expr</text>
    <text x="380" y="145" text-anchor="middle" font-size="10" fill="#2c2c2c">apply(sym, ...)</text>
    <text x="380" y="165" text-anchor="middle" font-size="10" fill="#666">(compilable)</text>
  </g>
  <defs>
    <marker id="al" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#7a3b3b"/>
    </marker>
  </defs>
  <text x="250" y="230" text-anchor="middle" font-size="10" fill="#2c2c2c" font-style="italic">
    Le lowering est un choix. Rien ne devient du code automatiquement.
  </text>
  <text x="250" y="255" text-anchor="middle" font-size="10" fill="#666">
    (Evite que chaque domaine devienne un nouvel IR.)
  </text>
</svg>
