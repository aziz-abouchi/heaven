<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" font-family="Georgia, serif">
  <rect width="500" height="320" fill="#faf7f2"/>
  <text x="250" y="30" text-anchor="middle" font-size="14" font-style="italic" fill="#2c2c2c">
    Un foncteur preserve la structure
  </text>

  <!-- Categorie source (gauche) -->
  <g>
    <rect x="30" y="60" width="180" height="190" fill="none" stroke="#7a3b3b" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="120" y="80" text-anchor="middle" font-size="11" fill="#7a3b3b" font-style="italic">Categorie C</text>

    <circle cx="80" cy="140" r="25" fill="#c0d8e8" stroke="#2c2c2c" stroke-width="1.5"/>
    <text x="80" y="146" text-anchor="middle" font-size="13" fill="#2c2c2c" font-family="monospace">A</text>

    <circle cx="170" cy="140" r="25" fill="#d0e8c0" stroke="#2c2c2c" stroke-width="1.5"/>
    <text x="170" y="146" text-anchor="middle" font-size="13" fill="#2c2c2c" font-family="monospace">B</text>

    <path d="M 105 140 L 143 140" fill="none" stroke="#2c2c2c" stroke-width="1.5" marker-end="url(#arr17f)"/>
    <text x="124" y="133" text-anchor="middle" font-size="11" fill="#2c2c2c" font-family="monospace">f</text>
  </g>

  <!-- Categorie cible (droite) -->
  <g>
    <rect x="290" y="60" width="180" height="190" fill="none" stroke="#7a3b3b" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="380" y="80" text-anchor="middle" font-size="11" fill="#7a3b3b" font-style="italic">Categorie D</text>

    <circle cx="340" cy="140" r="25" fill="#c0d8e8" stroke="#2c2c2c" stroke-width="1.5"/>
    <text x="340" y="146" text-anchor="middle" font-size="13" fill="#2c2c2c" font-family="monospace">F A</text>

    <circle cx="430" cy="140" r="25" fill="#d0e8c0" stroke="#2c2c2c" stroke-width="1.5"/>
    <text x="430" y="146" text-anchor="middle" font-size="13" fill="#2c2c2c" font-family="monospace">F B</text>

    <path d="M 365 140 L 403 140" fill="none" stroke="#2c2c2c" stroke-width="1.5" marker-end="url(#arr17f)"/>
    <text x="384" y="133" text-anchor="middle" font-size="11" fill="#2c2c2c" font-family="monospace">F f</text>
  </g>

  <!-- Fleches du foncteur F -->
  <g>
    <path d="M 110 185 L 335 185" fill="none" stroke="#7a3b3b" stroke-width="1.5" marker-end="url(#arr17)"/>
    <text x="222" y="178" text-anchor="middle" font-size="12" fill="#7a3b3b" font-style="italic">F</text>
    <path d="M 175 205 L 425 205" fill="none" stroke="#7a3b3b" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arr17)"/>
  </g>

  <!-- Regle -->
  <text x="250" y="270" text-anchor="middle" font-size="11" fill="#2c2c2c" font-family="monospace">
    F (g &#8728; f) = F g &#8728; F f
  </text>
  <text x="250" y="295" text-anchor="middle" font-size="10" fill="#666" font-style="italic">
    Un foncteur transporte, il ne deforme pas.
  </text>

  <defs>
    <marker id="arr17f" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2c2c2c"/>
    </marker>
    <marker id="arr17" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#7a3b3b"/>
    </marker>
  </defs>
</svg>
