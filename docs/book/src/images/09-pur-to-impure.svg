<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" font-family="Georgia, serif">
  <rect width="500" height="320" fill="#faf7f2"/>
  <text x="250" y="30" text-anchor="middle" font-size="14" font-style="italic" fill="#2c2c2c">
    La frontiere entre le noyau pur et le monde
  </text>
  <!-- Noyau pur (interieur) -->
  <g>
    <rect x="40" y="70" width="200" height="200" fill="#fff" stroke="#2c2c2c" stroke-width="1.5"/>
    <text x="140" y="100" text-anchor="middle" font-size="13" font-style="italic" fill="#7a3b3b">Noyau pur</text>
    <text x="140" y="125" text-anchor="middle" font-size="10" fill="#666">CIC (6 primitives)</text>
    <text x="140" y="160" text-anchor="middle" font-size="11" fill="#2c2c2c">inc x = x + 1</text>
    <text x="140" y="180" text-anchor="middle" font-size="11" fill="#2c2c2c">map f xs</text>
    <text x="140" y="200" text-anchor="middle" font-size="11" fill="#2c2c2c">theorem t : ...</text>
    <text x="140" y="235" text-anchor="middle" font-size="10" fill="#666" font-style="italic">aucun effet de bord</text>
    <text x="140" y="255" text-anchor="middle" font-size="10" fill="#666" font-style="italic">prouvable</text>
  </g>
  <!-- Frontiere -->
  <g>
    <line x1="250" y1="70" x2="250" y2="270" stroke="#7a3b3b" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="250" y="295" text-anchor="middle" font-size="10" fill="#7a3b3b" font-style="italic">effets algebriques</text>
  </g>
  <!-- Monde impur (exterieur) -->
  <g>
    <rect x="260" y="70" width="200" height="200" fill="#fff" stroke="#2c2c2c" stroke-width="1.5"/>
    <text x="360" y="100" text-anchor="middle" font-size="13" font-style="italic" fill="#7a3b3b">Monde</text>
    <text x="360" y="125" text-anchor="middle" font-size="10" fill="#666">fichiers, reseau, C</text>
    <text x="360" y="160" text-anchor="middle" font-size="11" fill="#2c2c2c">readFile / writeFile</text>
    <text x="360" y="180" text-anchor="middle" font-size="11" fill="#2c2c2c">HTTP / socket</text>
    <text x="360" y="200" text-anchor="middle" font-size="11" fill="#2c2c2c">spawn / tell / recv</text>
    <text x="360" y="235" text-anchor="middle" font-size="10" fill="#666" font-style="italic">change le monde</text>
    <text x="360" y="255" text-anchor="middle" font-size="10" fill="#666" font-style="italic">non prouvable directement</text>
  </g>
</svg>
