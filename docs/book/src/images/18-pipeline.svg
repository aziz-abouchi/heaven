<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" font-family="Georgia, serif">
  <rect width="500" height="320" fill="#faf7f2"/>
  <text x="250" y="30" text-anchor="middle" font-size="14" font-style="italic" fill="#2c2c2c">
    Le pipeline : source vers backends
  </text>

  <!-- Source -->
  <g>
    <rect x="180" y="55" width="140" height="35" fill="#c0d8e8" stroke="#2c2c2c" stroke-width="1.5"/>
    <text x="250" y="78" text-anchor="middle" font-size="11" fill="#2c2c2c" font-family="monospace">source Heaven</text>
  </g>

  <path d="M 250 90 L 250 110" fill="none" stroke="#7a3b3b" stroke-width="1.5" marker-end="url(#arr18p)"/>

  <!-- Parse -->
  <g>
    <rect x="180" y="115" width="140" height="35" fill="#d0e8c0" stroke="#2c2c2c" stroke-width="1.5"/>
    <text x="250" y="138" text-anchor="middle" font-size="11" fill="#2c2c2c" font-family="monospace">parse / lower</text>
  </g>

  <path d="M 250 150 L 250 170" fill="none" stroke="#7a3b3b" stroke-width="1.5" marker-end="url(#arr18p)"/>

  <!-- Expr.Store -->
  <g>
    <rect x="160" y="175" width="180" height="40" fill="#e8d0c0" stroke="#2c2c2c" stroke-width="1.5"/>
    <text x="250" y="200" text-anchor="middle" font-size="11" fill="#2c2c2c" font-family="monospace">Expr.Store (IR unique)</text>
  </g>

  <!-- Trois fleches sortantes -->
  <g>
    <path d="M 200 215 L 90 250" fill="none" stroke="#7a3b3b" stroke-width="1.5" marker-end="url(#arr18p)"/>
    <text x="120" y="243" font-size="10" fill="#7a3b3b" font-style="italic">eval</text>
  </g>
  <g>
    <path d="M 250 215 L 250 250" fill="none" stroke="#7a3b3b" stroke-width="1.5" marker-end="url(#arr18p)"/>
    <text x="260" y="243" font-size="10" fill="#7a3b3b" font-style="italic">MIR</text>
  </g>
  <g>
    <path d="M 300 215 L 410 250" fill="none" stroke="#7a3b3b" stroke-width="1.5" marker-end="url(#arr18p)"/>
    <text x="365" y="243" font-size="10" fill="#7a3b3b" font-style="italic">C / TCC</text>
  </g>

  <!-- Destinations -->
  <g>
    <rect x="30" y="255" width="120" height="40" fill="#fff" stroke="#2c2c2c" stroke-width="1"/>
    <text x="90" y="280" text-anchor="middle" font-size="10" fill="#2c2c2c" font-family="monospace">interprete</text>
  </g>
  <g>
    <rect x="185" y="255" width="130" height="40" fill="#fff" stroke="#2c2c2c" stroke-width="1"/>
    <text x="250" y="275" text-anchor="middle" font-size="10" fill="#2c2c2c" font-family="monospace">QBE / WASM</text>
    <text x="250" y="288" text-anchor="middle" font-size="9" fill="#666" font-style="italic">natifs</text>
  </g>
  <g>
    <rect x="350" y="255" width="120" height="40" fill="#fff" stroke="#2c2c2c" stroke-width="1"/>
    <text x="410" y="280" text-anchor="middle" font-size="10" fill="#2c2c2c" font-family="monospace">C natif</text>
  </g>

  <defs>
    <marker id="arr18p" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#7a3b3b"/>
    </marker>
  </defs>
</svg>
