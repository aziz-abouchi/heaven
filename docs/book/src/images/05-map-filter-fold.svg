<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" font-family="Georgia, serif">
  <rect width="500" height="400" fill="#faf7f2"/>
  <text x="250" y="30" text-anchor="middle" font-size="14" font-style="italic" fill="#2c2c2c">
    Trois operations sur une meme liste
  </text>
  <!-- Liste source -->
  <g>
    <text x="250" y="65" text-anchor="middle" font-size="12" fill="#7a3b3b">[1, 2, 3, 4]</text>
  </g>
  <!-- map -->
  <g>
    <text x="50" y="120" font-size="12" font-style="italic" fill="#2c2c2c">map inc</text>
    <text x="50" y="140" font-size="10" fill="#666">appliquer une fonction</text>
    <rect x="50" y="150" width="400" height="40" fill="#fff" stroke="#2c2c2c" stroke-width="1"/>
    <text x="250" y="175" text-anchor="middle" font-size="13" fill="#2c2c2c">[2, 3, 4, 5]</text>
  </g>
  <!-- filter -->
  <g>
    <text x="50" y="225" font-size="12" font-style="italic" fill="#2c2c2c">filter even</text>
    <text x="50" y="245" font-size="10" fill="#666">garder ceux qui satisfont</text>
    <rect x="50" y="255" width="400" height="40" fill="#fff" stroke="#2c2c2c" stroke-width="1"/>
    <text x="250" y="280" text-anchor="middle" font-size="13" fill="#2c2c2c">[2, 4]</text>
  </g>
  <!-- fold -->
  <g>
    <text x="50" y="330" font-size="12" font-style="italic" fill="#2c2c2c">foldl (+) 0</text>
    <text x="50" y="350" font-size="10" fill="#666">resumer en une valeur</text>
    <rect x="200" y="320" width="100" height="40" fill="#faf7f2" stroke="#7a3b3b" stroke-width="2"/>
    <text x="250" y="345" text-anchor="middle" font-size="14" fill="#2c2c2c">10</text>
  </g>
  <!-- Phrase -->
  <text x="250" y="385" text-anchor="middle" font-size="10" fill="#2c2c2c">
    Meme liste, trois usages differents.
  </text>
</svg>
