<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" font-family="Georgia, serif">
  <rect width="500" height="320" fill="#faf7f2"/>
  <text x="250" y="30" text-anchor="middle" font-size="14" font-style="italic" fill="#2c2c2c">
    cata : replier une liste en une valeur
  </text>

  <!-- Liste source -->
  <g>
    <rect x="50" y="60" width="60" height="40" fill="#d0e8c0" stroke="#2c2c2c" stroke-width="1"/>
    <text x="80" y="85" text-anchor="middle" font-size="13" fill="#2c2c2c" font-family="monospace">1</text>
    <rect x="140" y="60" width="60" height="40" fill="#d0e8c0" stroke="#2c2c2c" stroke-width="1"/>
    <text x="170" y="85" text-anchor="middle" font-size="13" fill="#2c2c2c" font-family="monospace">2</text>
    <rect x="230" y="60" width="60" height="40" fill="#d0e8c0" stroke="#2c2c2c" stroke-width="1"/>
    <text x="260" y="85" text-anchor="middle" font-size="13" fill="#2c2c2c" font-family="monospace">3</text>
    <rect x="320" y="60" width="70" height="40" fill="#faf7f2" stroke="#2c2c2c" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="355" y="85" text-anchor="middle" font-size="12" fill="#666" font-family="monospace" font-style="italic">nil</text>
  </g>

  <!-- Arrow down -->
  <g>
    <path d="M 250 105 L 250 155" fill="none" stroke="#7a3b3b" stroke-width="2" marker-end="url(#arr)"/>
    <text x="260" y="135" font-size="10" fill="#7a3b3b" font-style="italic">cons &#8614; f,  nil &#8614; z</text>
  </g>

  <!-- Application -->
  <g>
    <rect x="40" y="165" width="420" height="50" fill="#c0d8e8" stroke="#2c2c2c" stroke-width="1.5"/>
    <text x="250" y="195" text-anchor="middle" font-size="13" fill="#2c2c2c" font-family="monospace">
      f 1 (f 2 (f 3 z))
    </text>
  </g>

  <!-- Result -->
  <g>
    <path d="M 250 220 L 250 250" fill="none" stroke="#7a3b3b" stroke-width="2" marker-end="url(#arr)"/>
  </g>
  <g>
    <text x="250" y="285" text-anchor="middle" font-size="16" fill="#7a3b3b" font-style="italic">
      une seule valeur
    </text>
  </g>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#7a3b3b"/>
    </marker>
  </defs>
</svg>
