<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" font-family="Georgia, serif">
  <rect width="500" height="280" fill="#faf7f2"/>
  <text x="250" y="30" text-anchor="middle" font-size="14" font-style="italic" fill="#2c2c2c">
    La limite des 64 bits
  </text>
  <!-- Boite i64 -->
  <g>
    <rect x="80" y="80" width="340" height="80" fill="#fff" stroke="#2c2c2c" stroke-width="1.5"/>
    <text x="250" y="105" text-anchor="middle" font-size="12" fill="#7a3b3b" font-style="italic">i64</text>
    <text x="250" y="130" text-anchor="middle" font-size="14" fill="#2c2c2c">9 223 372 036 854 775 807</text>
    <text x="250" y="150" text-anchor="middle" font-size="10" fill="#666">environ 9.2 x 10^18</text>
  </g>
  <!-- Comparaison -->
  <g>
    <text x="250" y="200" text-anchor="middle" font-size="11" fill="#2c2c2c">
      Pour un RSA 2048 bits, il faut des nombres
    </text>
    <text x="250" y="220" text-anchor="middle" font-size="11" fill="#2c2c2c">
      environ 600 chiffres decimaux.
    </text>
    <text x="250" y="250" text-anchor="middle" font-size="11" fill="#7a3b3b" font-style="italic">
      i64 ne suffit pas. Il faut construire plus grand.
    </text>
  </g>
</svg>
