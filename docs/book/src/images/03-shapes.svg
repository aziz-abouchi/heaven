<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 260" font-family="Georgia, serif">
  <rect width="500" height="260" fill="#faf7f2"/>
  <text x="250" y="30" text-anchor="middle" font-size="14" font-style="italic" fill="#2c2c2c">
    Deux aspects d'une même liste
  </text>
  <!-- Aspect 1 : nil -->
  <g>
    <text x="120" y="70" text-anchor="middle" font-size="12" font-style="italic" fill="#7a3b3b">Aspect 1</text>
    <rect x="40" y="85" width="160" height="100" fill="#fff" stroke="#2c2c2c" stroke-width="1"/>
    <text x="120" y="125" text-anchor="middle" font-size="20" fill="#2c2c2c" font-style="italic">nil</text>
    <text x="120" y="150" text-anchor="middle" font-size="10" fill="#666">la liste vide</text>
    <text x="120" y="170" text-anchor="middle" font-size="11" fill="#7a3b3b">head nil = ???</text>
  </g>
  <!-- Aspect 2 : cons -->
  <g>
    <text x="380" y="70" text-anchor="middle" font-size="12" font-style="italic" fill="#7a3b3b">Aspect 2</text>
    <rect x="300" y="85" width="160" height="100" fill="#fff" stroke="#2c2c2c" stroke-width="1"/>
    <text x="380" y="125" text-anchor="middle" font-size="16" fill="#2c2c2c">cons x xs</text>
    <text x="380" y="150" text-anchor="middle" font-size="10" fill="#666">un élément + le reste</text>
    <text x="380" y="170" text-anchor="middle" font-size="11" fill="#7a3b3b">head (cons x xs) = x</text>
  </g>
  <!-- Fleche entre -->
  <g>
    <path d="M 210 135 Q 250 100 290 135" fill="none" stroke="#7a3b3b" stroke-width="1.5"/>
    <text x="250" y="95" text-anchor="middle" font-size="11" fill="#7a3b3b" font-style="italic">voir comme</text>
  </g>
  <!-- Phrase du bas -->
  <text x="250" y="215" text-anchor="middle" font-size="11" fill="#666" font-style="italic">
    « Ne pas penser, mais regarder. »
  </text>
  <text x="250" y="240" text-anchor="middle" font-size="10" fill="#2c2c2c">— Wittgenstein</text>
</svg>
