<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" font-family="Georgia, serif">
  <rect width="500" height="320" fill="#faf7f2"/>
  <text x="250" y="30" text-anchor="middle" font-size="14" font-style="italic" fill="#2c2c2c">
    Jugement de typage quantitatif
  </text>

  <!-- Contexte Gamma -->
  <g>
    <rect x="30" y="70" width="180" height="180" fill="#f0e8e8" stroke="#2c2c2c" stroke-width="1.5"/>
    <text x="120" y="95" text-anchor="middle" font-size="13" fill="#7a3b3b" font-family="monospace">&#915; (contexte)</text>
    <line x1="50" y1="105" x2="190" y2="105" stroke="#666" stroke-width="0.5"/>

    <text x="50" y="130" font-size="12" fill="#2c2c2c" font-family="monospace">x :&#185; A</text>
    <text x="50" y="155" font-size="12" fill="#2c2c2c" font-family="monospace">y :&#8304; B</text>
    <text x="50" y="180" font-size="12" fill="#2c2c2c" font-family="monospace">z :^&#969; C</text>

    <text x="120" y="215" text-anchor="middle" font-size="10" fill="#666" font-style="italic">
      variables + multiplicites
    </text>
  </g>

  <!-- Fleche turnstile -->
  <g>
    <text x="235" y="165" text-anchor="middle" font-size="24" fill="#7a3b3b">&#8866;</text>
  </g>

  <!-- Terme et type -->
  <g>
    <rect x="270" y="100" width="200" height="120" fill="#e8f0e8" stroke="#2c2c2c" stroke-width="1.5"/>
    <text x="370" y="130" text-anchor="middle" font-size="13" fill="#2c2c2c" font-family="monospace">t : A</text>
    <line x1="290" y1="145" x2="450" y2="145" stroke="#666" stroke-width="0.5"/>
    <text x="370" y="170" text-anchor="middle" font-size="11" fill="#2c2c2c">terme + type</text>
    <text x="370" y="195" text-anchor="middle" font-size="10" fill="#666" font-style="italic">
      le verificateur compte les usages
    </text>
  </g>

  <!-- Regles -->
  <g>
    <text x="250" y="290" text-anchor="middle" font-size="11" fill="#2c2c2c">
      Le nombre d'usages de chaque variable doit matcher sa multiplicite.
    </text>
  </g>
</svg>
