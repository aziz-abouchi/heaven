<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" font-family="Georgia, serif">
  <rect width="500" height="300" fill="#faf7f2"/>
  <text x="250" y="30" text-anchor="middle" font-size="14" font-style="italic" fill="#2c2c2c">
    La frontiere Heaven / C
  </text>
  <!-- Heaven -->
  <g>
    <rect x="40" y="80" width="200" height="140" fill="#fff" stroke="#2c2c2c" stroke-width="1.5"/>
    <text x="140" y="110" text-anchor="middle" font-size="13" font-style="italic" fill="#7a3b3b">Heaven</text>
    <text x="140" y="140" text-anchor="middle" font-size="11" fill="#2c2c2c">extern fn</text>
    <text x="140" y="160" text-anchor="middle" font-size="11" fill="#2c2c2c">c_func : Int -&gt; Int</text>
    <text x="140" y="195" text-anchor="middle" font-size="10" fill="#666">declaration seulement</text>
  </g>
  <!-- Frontiere -->
  <g>
    <line x1="250" y1="80" x2="250" y2="220" stroke="#7a3b3b" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="250" y="250" text-anchor="middle" font-size="10" fill="#7a3b3b" font-style="italic">ABI C</text>
  </g>
  <!-- C -->
  <g>
    <rect x="260" y="80" width="200" height="140" fill="#fff" stroke="#2c2c2c" stroke-width="1.5"/>
    <text x="360" y="110" text-anchor="middle" font-size="13" font-style="italic" fill="#7a3b3b">C</text>
    <text x="360" y="140" text-anchor="middle" font-size="11" fill="#2c2c2c">int c_func(int x)</text>
    <text x="360" y="160" text-anchor="middle" font-size="11" fill="#2c2c2c">{ return x * 2; }</text>
    <text x="360" y="195" text-anchor="middle" font-size="10" fill="#666">implementation</text>
  </g>
  <text x="250" y="280" text-anchor="middle" font-size="10" fill="#666">
    En V0 : l'ABI C est en roadmap, pas completement stable.
  </text>
</svg>
