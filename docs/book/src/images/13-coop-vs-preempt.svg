<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" font-family="Georgia, serif">
  <rect width="500" height="320" fill="#faf7f2"/>
  <text x="250" y="30" text-anchor="middle" font-size="14" font-style="italic" fill="#2c2c2c">
    Deux modeles de concurrence
  </text>
  <!-- Cooperatif -->
  <g>
    <text x="140" y="70" text-anchor="middle" font-size="12" fill="#7a3b3b" font-style="italic">Cooperatif</text>
    <text x="140" y="90" text-anchor="middle" font-size="10" fill="#666">la tache cede la main</text>
    <!-- Timeline -->
    <line x1="40" y1="140" x2="240" y2="140" stroke="#2c2c2c" stroke-width="1"/>
    <rect x="50" y="120" width="40" height="40" fill="#d0e8c0" stroke="#2c2c2c" stroke-width="1"/>
    <text x="70" y="145" text-anchor="middle" font-size="10" fill="#2c2c2c">A</text>
    <rect x="90" y="120" width="40" height="40" fill="#c0d8e8" stroke="#2c2c2c" stroke-width="1"/>
    <text x="110" y="145" text-anchor="middle" font-size="10" fill="#2c2c2c">B</text>
    <rect x="130" y="120" width="40" height="40" fill="#d0e8c0" stroke="#2c2c2c" stroke-width="1"/>
    <text x="150" y="145" text-anchor="middle" font-size="10" fill="#2c2c2c">A</text>
    <rect x="170" y="120" width="40" height="40" fill="#c0d8e8" stroke="#2c2c2c" stroke-width="1"/>
    <text x="190" y="145" text-anchor="middle" font-size="10" fill="#2c2c2c">B</text>
    <text x="140" y="195" text-anchor="middle" font-size="10" fill="#666" font-style="italic">yield aux frontieres</text>
  </g>
  <!-- Preemptif -->
  <g>
    <text x="360" y="70" text-anchor="middle" font-size="12" fill="#7a3b3b" font-style="italic">Preemptif</text>
    <text x="360" y="90" text-anchor="middle" font-size="10" fill="#666">le systeme interrompt</text>
    <!-- Timeline -->
    <line x1="260" y1="140" x2="460" y2="140" stroke="#2c2c2c" stroke-width="1"/>
    <rect x="270" y="120" width="40" height="40" fill="#d0e8c0" stroke="#2c2c2c" stroke-width="1"/>
    <text x="290" y="145" text-anchor="middle" font-size="10" fill="#2c2c2c">A</text>
    <rect x="310" y="120" width="40" height="40" fill="#c0d8e8" stroke="#2c2c2c" stroke-width="1"/>
    <text x="330" y="145" text-anchor="middle" font-size="10" fill="#2c2c2c">B</text>
    <rect x="350" y="120" width="40" height="40" fill="#d0e8c0" stroke="#2c2c2c" stroke-width="1"/>
    <text x="370" y="145" text-anchor="middle" font-size="10" fill="#2c2c2c">A</text>
    <rect x="390" y="120" width="40" height="40" fill="#c0d8e8" stroke="#2c2c2c" stroke-width="1"/>
    <text x="410" y="145" text-anchor="middle" font-size="10" fill="#2c2c2c">B</text>
    <text x="360" y="195" text-anchor="middle" font-size="10" fill="#666" font-style="italic">interruption a tout moment</text>
  </g>
  <text x="250" y="255" text-anchor="middle" font-size="11" fill="#2c2c2c" font-style="italic">
    Heaven V0 utilise le modele cooperatif.
  </text>
  <text x="250" y="285" text-anchor="middle" font-size="10" fill="#666">
    Plus simple, mais demande la cooperation des taches.
  </text>
</svg>
