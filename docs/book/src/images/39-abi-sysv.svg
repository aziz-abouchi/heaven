<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 240" font-family="monospace" font-size="12">
<defs><marker id="a39b" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/></marker></defs>
<rect x="20" y="30" width="200" height="50" rx="6" fill="#fce8e6" stroke="#d93025" stroke-width="2"/>
<text x="120" y="50" text-anchor="middle" font-weight="bold">kernel / glibc startup</text>
<text x="120" y="68" text-anchor="middle" font-size="10" fill="#555">argc to edi, argv to rsi</text>
<rect x="270" y="30" width="230" height="50" rx="6" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
<text x="385" y="50" text-anchor="middle" font-weight="bold">export function l $main(l, l)</text>
<text x="385" y="68" text-anchor="middle" font-size="10" fill="#555">storel argv, $heaven_argv</text>
<line x1="220" y1="55" x2="270" y2="55" stroke="#333" stroke-width="1.5" marker-end="url(#a39b)"/>
<rect x="270" y="120" width="230" height="50" rx="6" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
<text x="385" y="140" text-anchor="middle" font-weight="bold">r = call $heaven_main()</text>
<text x="385" y="158" text-anchor="middle" font-size="10" fill="#555">corps compile</text>
<line x1="385" y1="80" x2="385" y2="120" stroke="#333" stroke-width="1.5" marker-end="url(#a39b)"/>
<rect x="270" y="190" width="230" height="40" rx="6" fill="#e8f8ee" stroke="#1e8e3e" stroke-width="2"/>
<text x="385" y="208" text-anchor="middle" font-weight="bold">ret r - exit code</text>
<text x="385" y="222" text-anchor="middle" font-size="10" fill="#555">glibc lit eax &amp; 0xFFFFFFFF</text>
<line x1="385" y1="170" x2="385" y2="190" stroke="#333" stroke-width="1.5" marker-end="url(#a39b)"/>
<text x="120" y="145" text-anchor="middle" font-size="10" fill="#666">data $heaven_argv</text>
<text x="120" y="162" text-anchor="middle" font-size="10" fill="#666">= { l 0 }</text>
<text x="260" y="15" text-anchor="middle" font-size="11" font-style="italic">ABI SysV AMD64 - argc/argv natifs</text>
</svg>
