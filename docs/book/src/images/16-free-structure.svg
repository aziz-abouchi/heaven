<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" font-family="Georgia, serif">
  <rect width="500" height="320" fill="#faf7f2"/>
  <text x="250" y="30" text-anchor="middle" font-size="14" font-style="italic" fill="#2c2c2c">
    Un programme Free comme chaine d'instructions
  </text>

  <!-- Push 10 -->
  <g>
    <rect x="20" y="80" width="100" height="55" fill="#c0d8e8" stroke="#2c2c2c" stroke-width="1.5"/>
    <text x="70" y="102" text-anchor="middle" font-size="12" fill="#2c2c2c" font-family="monospace">Push 10</text>
    <text x="70" y="122" text-anchor="middle" font-size="9" fill="#666" font-style="italic">empile 10</text>
  </g>

  <!-- arrow -->
  <g>
    <path d="M 120 107 L 138 107" fill="none" stroke="#7a3b3b" stroke-width="1.5" marker-end="url(#arr16)"/>
  </g>

  <!-- Push 20 -->
  <g>
    <rect x="140" y="80" width="100" height="55" fill="#c0d8e8" stroke="#2c2c2c" stroke-width="1.5"/>
    <text x="190" y="102" text-anchor="middle" font-size="12" fill="#2c2c2c" font-family="monospace">Push 20</text>
    <text x="190" y="122" text-anchor="middle" font-size="9" fill="#666" font-style="italic">empile 20</text>
  </g>

  <!-- arrow -->
  <g>
    <path d="M 240 107 L 258 107" fill="none" stroke="#7a3b3b" stroke-width="1.5" marker-end="url(#arr16)"/>
  </g>

  <!-- Add -->
  <g>
    <rect x="260" y="80" width="100" height="55" fill="#d0e8c0" stroke="#2c2c2c" stroke-width="1.5"/>
    <text x="310" y="102" text-anchor="middle" font-size="12" fill="#2c2c2c" font-family="monospace">Add</text>
    <text x="310" y="122" text-anchor="middle" font-size="9" fill="#666" font-style="italic">somme</text>
  </g>

  <!-- arrow -->
  <g>
    <path d="M 360 107 L 378 107" fill="none" stroke="#7a3b3b" stroke-width="1.5" marker-end="url(#arr16)"/>
  </g>

  <!-- Pure 0 -->
  <g>
    <rect x="380" y="80" width="100" height="55" fill="#e8d0c0" stroke="#2c2c2c" stroke-width="1.5"/>
    <text x="430" y="102" text-anchor="middle" font-size="12" fill="#2c2c2c" font-family="monospace">Pure 0</text>
    <text x="430" y="122" text-anchor="middle" font-size="9" fill="#666" font-style="italic">fin</text>
  </g>

  <!-- Code representation -->
  <g>
    <rect x="30" y="180" width="440" height="55" fill="#fff" stroke="#2c2c2c" stroke-width="1"/>
    <text x="250" y="205" text-anchor="middle" font-size="11" fill="#2c2c2c" font-family="monospace">
      (Push 10 (Push 20 (Add (Pure 0))))
    </text>
    <text x="250" y="225" text-anchor="middle" font-size="9" fill="#666" font-style="italic">
      chaque constructeur porte la suite du programme
    </text>
  </g>

  <!-- Verdict -->
  <text x="250" y="275" text-anchor="middle" font-size="11" fill="#2c2c2c">
    La structure ne fait rien : elle raconte.
  </text>
  <text x="250" y="297" text-anchor="middle" font-size="10" fill="#666" font-style="italic">
    Un interpreteur decidera du sens.
  </text>

  <defs>
    <marker id="arr16" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#7a3b3b"/>
    </marker>
  </defs>
</svg>
