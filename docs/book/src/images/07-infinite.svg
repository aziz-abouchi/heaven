<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" font-family="Georgia, serif">
  <rect width="500" height="280" fill="#faf7f2"/>
  <text x="250" y="30" text-anchor="middle" font-size="14" font-style="italic" fill="#2c2c2c">
    Prendre 3 elements d'un stream infini
  </text>
  <!-- Stream infini -->
  <g>
    <text x="60" y="110" font-size="11" fill="#7a3b3b" font-style="italic">nat : 0 1 2 3 4 5 ...</text>
    <!-- Cercles -->
    <circle cx="140" cy="140" r="18" fill="#fff" stroke="#2c2c2c" stroke-width="1.5"/>
    <text x="140" y="145" text-anchor="middle" font-size="12" fill="#2c2c2c">0</text>
    <circle cx="200" cy="140" r="18" fill="#fff" stroke="#2c2c2c" stroke-width="1.5"/>
    <text x="200" y="145" text-anchor="middle" font-size="12" fill="#2c2c2c">1</text>
    <circle cx="260" cy="140" r="18" fill="#fff" stroke="#2c2c2c" stroke-width="1.5"/>
    <text x="260" y="145" text-anchor="middle" font-size="12" fill="#2c2c2c">2</text>
    <circle cx="320" cy="140" r="18" fill="#fff" stroke="#2c2c2c" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="320" y="145" text-anchor="middle" font-size="12" fill="#888">3</text>
    <circle cx="380" cy="140" r="18" fill="#fff" stroke="#2c2c2c" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="380" y="145" text-anchor="middle" font-size="12" fill="#888">4</text>
    <text x="440" y="145" text-anchor="middle" font-size="14" fill="#888">...</text>
  </g>
  <!-- take 3 -->
  <g>
    <text x="250" y="205" text-anchor="middle" font-size="12" fill="#7a3b3b" font-style="italic">
      take 3 nat  --  [0, 1, 2]
    </text>
    <text x="250" y="235" text-anchor="middle" font-size="11" fill="#2c2c2c">
      Seuls les 3 premiers elements sont calcules.
    </text>
    <text x="250" y="260" text-anchor="middle" font-size="10" fill="#666">
      Les autres restent des thunks, jamais forces.
    </text>
  </g>
</svg>
