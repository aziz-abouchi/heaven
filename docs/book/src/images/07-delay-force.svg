<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" font-family="Georgia, serif">
  <rect width="500" height="280" fill="#faf7f2"/>
  <text x="250" y="30" text-anchor="middle" font-size="14" font-style="italic" fill="#2c2c2c">
    delay : capturer un calcul, force : le declencher
  </text>
  <!-- delay -->
  <g>
    <rect x="40" y="70" width="150" height="80" fill="#fff" stroke="#2c2c2c" stroke-width="1"/>
    <text x="115" y="100" text-anchor="middle" font-size="13" fill="#2c2c2c" font-style="italic">delay (1 + 2)</text>
    <text x="115" y="125" text-anchor="middle" font-size="10" fill="#666">un thunk, en attente</text>
    <text x="115" y="140" text-anchor="middle" font-size="10" fill="#7a3b3b">(rien n'est encore calcule)</text>
  </g>
  <!-- fleche -->
  <g>
    <line x1="200" y1="110" x2="290" y2="110" stroke="#7a3b3b" stroke-width="2" marker-end="url(#a7)"/>
    <text x="245" y="100" text-anchor="middle" font-size="11" fill="#7a3b3b" font-style="italic">force</text>
  </g>
  <!-- resultat -->
  <g>
    <rect x="300" y="70" width="150" height="80" fill="#faf7f2" stroke="#7a3b3b" stroke-width="2"/>
    <text x="375" y="105" text-anchor="middle" font-size="22" fill="#2c2c2c">3</text>
    <text x="375" y="130" text-anchor="middle" font-size="10" fill="#666">memoise :</text>
    <text x="375" y="145" text-anchor="middle" font-size="10" fill="#7a3b3b">calcule une seule fois</text>
  </g>
  <!-- Deuxieme force -->
  <g>
    <text x="250" y="200" text-anchor="middle" font-size="11" fill="#666" font-style="italic">
      Un deuxieme force t rendrait 3 sans recalculer.
    </text>
    <text x="250" y="225" text-anchor="middle" font-size="11" fill="#2c2c2c">
      (force t) + (force t) = 3 + 3 = 6
    </text>
    <text x="250" y="250" text-anchor="middle" font-size="10" fill="#666">
      1 + 2 n'est calculé qu'une seule fois.
    </text>
  </g>
  <defs>
    <marker id="a7" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#7a3b3b"/>
    </marker>
  </defs>
</svg>
