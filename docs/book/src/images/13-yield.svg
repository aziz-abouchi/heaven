<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" font-family="Georgia, serif">
  <rect width="500" height="280" fill="#faf7f2"/>
  <text x="250" y="30" text-anchor="middle" font-size="14" font-style="italic" fill="#2c2c2c">
    Le yield : ceder la main explicitement
  </text>
  <!-- Tache A -->
  <g>
    <rect x="40" y="80" width="180" height="120" fill="#d0e8c0" stroke="#2c2c2c" stroke-width="1.5"/>
    <text x="130" y="105" text-anchor="middle" font-size="12" fill="#7a3b3b" font-style="italic">Tache A</text>
    <text x="130" y="135" text-anchor="middle" font-size="11" fill="#2c2c2c">calcul 1</text>
    <text x="130" y="155" text-anchor="middle" font-size="11" fill="#2c2c2c">calcul 2</text>
    <rect x="60" y="170" width="140" height="25" fill="#fff" stroke="#7a3b3b" stroke-width="1.5"/>
    <text x="130" y="188" text-anchor="middle" font-size="11" fill="#7a3b3b">yield new_state</text>
  </g>
  <!-- Fleche -->
  <g>
    <line x1="220" y1="140" x2="280" y2="140" stroke="#7a3b3b" stroke-width="2" marker-end="url(#ay)"/>
    <text x="250" y="130" text-anchor="middle" font-size="10" fill="#7a3b3b" font-style="italic">cede</text>
  </g>
  <!-- Tache B -->
  <g>
    <rect x="280" y="80" width="180" height="120" fill="#c0d8e8" stroke="#2c2c2c" stroke-width="1.5"/>
    <text x="370" y="105" text-anchor="middle" font-size="12" fill="#7a3b3b" font-style="italic">Tache B</text>
    <text x="370" y="135" text-anchor="middle" font-size="11" fill="#2c2c2c">calcul</text>
    <text x="370" y="155" text-anchor="middle" font-size="11" fill="#2c2c2c">calcul</text>
    <text x="370" y="188" text-anchor="middle" font-size="11" fill="#666">...</text>
  </g>
  <!-- Explication -->
  <text x="250" y="230" text-anchor="middle" font-size="11" fill="#2c2c2c">
    yield marque un point de cooperation.
  </text>
  <text x="250" y="255" text-anchor="middle" font-size="10" fill="#666" font-style="italic">
    Sans yield, une tache accapare le thread jusqu'a la fin.
  </text>
  <defs>
    <marker id="ay" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#7a3b3b"/>
    </marker>
  </defs>
</svg>
