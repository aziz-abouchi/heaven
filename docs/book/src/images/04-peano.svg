<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" font-family="Georgia, serif">
  <rect width="500" height="300" fill="#faf7f2"/>
  <text x="250" y="30" text-anchor="middle" font-size="14" font-style="italic" fill="#2c2c2c">
    L'infini à partir du fini (Peano, 1889)
  </text>
  <!-- Chaine -->
  <g>
    <circle cx="80" cy="140" r="28" fill="#fff" stroke="#2c2c2c" stroke-width="1.5"/>
    <text x="80" y="145" text-anchor="middle" font-size="14" fill="#2c2c2c" font-style="italic">Zero</text>
    <circle cx="200" cy="140" r="28" fill="#fff" stroke="#2c2c2c" stroke-width="1.5"/>
    <text x="200" y="145" text-anchor="middle" font-size="14" fill="#2c2c2c" font-style="italic">Succ 0</text>
    <circle cx="320" cy="140" r="28" fill="#fff" stroke="#2c2c2c" stroke-width="1.5"/>
    <text x="320" y="145" text-anchor="middle" font-size="14" fill="#2c2c2c" font-style="italic">Succ 1</text>
    <circle cx="440" cy="140" r="28" fill="#fff" stroke="#2c2c2c" stroke-width="1.5"/>
    <text x="440" y="145" text-anchor="middle" font-size="14" fill="#2c2c2c" font-style="italic">...</text>
  </g>
  <!-- Fleches -->
  <g fill="none" stroke="#7a3b3b" stroke-width="2" marker-end="url(#arr)">
    <path d="M 110 140 L 168 140"/>
    <path d="M 230 140 L 288 140"/>
    <path d="M 350 140 L 408 140"/>
  </g>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#7a3b3b"/>
    </marker>
  </defs>
  <text x="250" y="200" text-anchor="middle" font-size="11" fill="#666" font-style="italic">
    « Zero est un nombre. Le successeur d'un nombre est un nombre. »
  </text>
  <text x="250" y="235" text-anchor="middle" font-size="11" fill="#2c2c2c">
    Cette simple regle engendre tous les entiers naturels.
  </text>
  <text x="250" y="270" text-anchor="middle" font-size="10" fill="#2c2c2c">— Giuseppe Peano, Arithmetices principia</text>
</svg>
