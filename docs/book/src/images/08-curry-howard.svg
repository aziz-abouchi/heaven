<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 340" font-family="Georgia, serif">
  <rect width="500" height="340" fill="#faf7f2"/>
  <text x="250" y="30" text-anchor="middle" font-size="14" font-style="italic" fill="#2c2c2c">
    Le triangle de Curry-Howard
  </text>
  <!-- Triangle -->
  <polygon points="250,80 100,270 400,270" fill="none" stroke="#2c2c2c" stroke-width="1.5"/>
  <!-- Sommet : Proposition -->
  <text x="250" y="70" text-anchor="middle" font-size="14" font-style="italic" fill="#2c2c2c">Proposition</text>
  <text x="250" y="90" text-anchor="middle" font-size="11" fill="#7a3b3b">« x + 0 = x »</text>
  <!-- Bas gauche : Type -->
  <text x="100" y="295" text-anchor="middle" font-size="14" font-style="italic" fill="#2c2c2c">Type</text>
  <text x="100" y="315" text-anchor="middle" font-size="10" fill="#7a3b3b">Int -&gt; Int</text>
  <!-- Bas droit : Programme -->
  <text x="400" y="295" text-anchor="middle" font-size="14" font-style="italic" fill="#2c2c2c">Programme</text>
  <text x="400" y="315" text-anchor="middle" font-size="10" fill="#7a3b3b">une fonction</text>
  <!-- Annotations internes -->
  <text x="160" y="170" font-size="10" fill="#666" font-style="italic">est un</text>
  <text x="320" y="170" font-size="10" fill="#666" font-style="italic">est un</text>
  <text x="250" y="240" text-anchor="middle" font-size="10" fill="#666" font-style="italic">est un</text>
  <!-- Citation -->
  <text x="250" y="200" text-anchor="middle" font-size="10" fill="#2c2c2c">
    « Une preuve d'une proposition P
  </text>
  <text x="250" y="215" text-anchor="middle" font-size="10" fill="#2c2c2c">
    est un programme de type P. »
  </text>
</svg>
