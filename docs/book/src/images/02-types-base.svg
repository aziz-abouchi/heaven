<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 260" font-family="Georgia, serif">
  <rect width="500" height="260" fill="#faf7f2"/>
  <text x="250" y="30" text-anchor="middle" font-size="14" font-style="italic" fill="#2c2c2c">
    Quatre manières d'être une valeur
  </text>
  <g font-size="11" fill="#2c2c2c">
    <!-- Int -->
    <rect x="40" y="80" width="100" height="100" fill="#fff" stroke="#2c2c2c" stroke-width="1"/>
    <text x="90" y="105" text-anchor="middle" font-size="13" font-style="italic" fill="#7a3b3b">Int</text>
    <text x="90" y="140" text-anchor="middle" font-size="18" fill="#2c2c2c">42</text>
    <text x="90" y="165" text-anchor="middle" font-size="10" fill="#666">entier</text>
    <!-- String -->
    <rect x="150" y="80" width="100" height="100" fill="#fff" stroke="#2c2c2c" stroke-width="1"/>
    <text x="200" y="105" text-anchor="middle" font-size="13" font-style="italic" fill="#7a3b3b">String</text>
    <text x="200" y="140" text-anchor="middle" font-size="14" fill="#2c2c2c">"bonjour"</text>
    <text x="200" y="165" text-anchor="middle" font-size="10" fill="#666">chaîne</text>
    <!-- Bool -->
    <rect x="260" y="80" width="100" height="100" fill="#fff" stroke="#2c2c2c" stroke-width="1"/>
    <text x="310" y="105" text-anchor="middle" font-size="13" font-style="italic" fill="#7a3b3b">Bool</text>
    <text x="310" y="140" text-anchor="middle" font-size="18" fill="#2c2c2c">true</text>
    <text x="310" y="165" text-anchor="middle" font-size="10" fill="#666">booléen</text>
    <!-- Unit -->
    <rect x="370" y="80" width="100" height="100" fill="#fff" stroke="#2c2c2c" stroke-width="1"/>
    <text x="420" y="105" text-anchor="middle" font-size="13" font-style="italic" fill="#7a3b3b">Unit</text>
    <text x="420" y="140" text-anchor="middle" font-size="18" fill="#2c2c2c">()</text>
    <text x="420" y="165" text-anchor="middle" font-size="10" fill="#666">rien</text>
  </g>
  <text x="250" y="220" text-anchor="middle" font-size="11" fill="#666" font-style="italic">
    « Les catégories ne sont pas des choses — ce sont des manières de classer les choses. »
  </text>
  <text x="250" y="240" text-anchor="middle" font-size="10" fill="#2c2c2c">— Aristote, Catégories</text>
</svg>
