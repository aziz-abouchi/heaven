<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 240" font-family="serif" font-size="14">
  <text x="260" y="25" text-anchor="middle" font-size="17" font-weight="bold">Trois régimes QTT</text>
  <rect x="20" y="60" width="150" height="130" fill="#fff0f0" stroke="#c00" stroke-width="1.5"/>
  <text x="95" y="90" text-anchor="middle" font-size="15" font-weight="bold">linear</text>
  <text x="95" y="115" text-anchor="middle" font-size="22" font-style="italic">1×</text>
  <text x="95" y="140" text-anchor="middle" font-size="12">utilisé exactement</text>
  <text x="95" y="158" text-anchor="middle" font-size="12">une fois</text>
  <text x="95" y="180" text-anchor="middle" font-size="11" fill="#666">ressource</text>
  <rect x="185" y="60" width="150" height="130" fill="#f5f5f5" stroke="#666" stroke-width="1.5"/>
  <text x="260" y="90" text-anchor="middle" font-size="15" font-weight="bold">erased</text>
  <text x="260" y="115" text-anchor="middle" font-size="22" font-style="italic">0×</text>
  <text x="260" y="140" text-anchor="middle" font-size="12">jamais utilisé</text>
  <text x="260" y="158" text-anchor="middle" font-size="12">(effacé)</text>
  <text x="260" y="180" text-anchor="middle" font-size="11" fill="#666">preuve, méta</text>
  <rect x="350" y="60" width="150" height="130" fill="#f0fff0" stroke="#383" stroke-width="1.5"/>
  <text x="425" y="90" text-anchor="middle" font-size="15" font-weight="bold">many</text>
  <text x="425" y="115" text-anchor="middle" font-size="22" font-style="italic">∞</text>
  <text x="425" y="140" text-anchor="middle" font-size="12">usage libre</text>
  <text x="425" y="158" text-anchor="middle" font-size="12">(aucune contrainte)</text>
  <text x="425" y="180" text-anchor="middle" font-size="11" fill="#666">valeur pure</text>
  <text x="260" y="220" text-anchor="middle" font-size="13" font-style="italic">« Qui possède quoi » — vérifié à la compilation</text>
</svg>