<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" font-family="Georgia, serif">
  <rect width="500" height="280" fill="#faf7f2"/>
  <text x="250" y="30" text-anchor="middle" font-size="14" font-style="italic" fill="#2c2c2c">
    Deux manieres d'appeler la meme fonction
  </text>
  <!-- Global -->
  <g>
    <rect x="40" y="80" width="200" height="120" fill="#fff" stroke="#2c2c2c" stroke-width="1.5"/>
    <text x="140" y="110" text-anchor="middle" font-size="12" fill="#7a3b3b" font-style="italic">Espace global</text>
    <text x="140" y="150" text-anchor="middle" font-size="14" fill="#2c2c2c">foo 5</text>
    <text x="140" y="180" text-anchor="middle" font-size="11" fill="#666">= 6</text>
  </g>
  <!-- Namespace -->
  <g>
    <rect x="260" y="80" width="200" height="120" fill="#fff" stroke="#2c2c2c" stroke-width="1.5"/>
    <text x="360" y="110" text-anchor="middle" font-size="12" fill="#7a3b3b" font-style="italic">Namespace M</text>
    <text x="360" y="150" text-anchor="middle" font-size="14" fill="#2c2c2c">M.foo 5</text>
    <text x="360" y="180" text-anchor="middle" font-size="11" fill="#666">= 6</text>
  </g>
  <text x="250" y="240" text-anchor="middle" font-size="11" fill="#2c2c2c">
    Meme fonction, deux noms.
  </text>
  <text x="250" y="260" text-anchor="middle" font-size="10" fill="#666">
    (Le nom qualifie evite les collisions.)
  </text>
</svg>
