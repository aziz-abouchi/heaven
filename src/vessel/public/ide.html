<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Heaven IDE</title>
  <link rel="stylesheet" href="common.css">
  <style>
    html, body { height: 100%; overflow: hidden; margin:0; }
    #top-bar {
      display: flex; align-items: center; gap: 16px;
      padding: 6px 16px; background: #0f0f0f; border-bottom:1px solid #1a1a1a;
    }
    #top-bar h1 { color:#00ff41; font-size:15px; }
    #toolbar {
      display: flex; gap: 6px; padding: 4px 16px;
      background: #111; border-bottom:1px solid #1a1a1a;
    }
    #toolbar button {
      font-size: 10px; padding: 2px 10px;
      background: #222; color: #aaa; border:1px solid #333;
      cursor: pointer; border-radius:3px;
    }
    #toolbar button.active { background:#1a3a1a; color:#00ff41; border-color:#00ff41; }
    #workspace {
      height: calc(100% - 80px); /* hauteur restante */
      display: grid;
      gap: 1px;
      background: #333;
      transition: grid-template-columns 0.2s, grid-template-rows 0.2s;
    }
    /* Grille par défaut : 4 panneaux en 2x2 */
    .layout-all {
      grid-template-columns: 2fr 1fr;
      grid-template-rows: 1fr 1fr;
    }
    /* Quand seul l'éditeur est visible */
    .layout-editor-only {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
    }
    /* Éditeur + REPL (colonne de droite vide) */
    .layout-editor-repl {
      grid-template-columns: 2fr 1fr;
      grid-template-rows: 1fr;
    }
    /* Éditeur + Debugger + Process (REPL caché) */
    .layout-no-repl {
      grid-template-columns: 2fr 1fr;
      grid-template-rows: 1fr 1fr;
    }
    /* Tous sauf Debugger */
    .layout-no-debug {
      grid-template-columns: 2fr 1fr;
      grid-template-rows: 1fr 1fr;
    }
    /* etc. On peut affiner, mais pour l'instant on gère via classes dynamiques */
    iframe {
      width: 100%; height: 100%; border: none; display: block;
    }
    .hidden-panel { display: none !important; }
  </style>
</head>
<body>
  <div id="top-bar">
    <h1>HEAVEN IDE</h1>
    <div class="nav">
      <a href="/">Vision</a>
      <a href="/repl">REPL</a>
      <a href="/dashboard">Dashboard</a>
      <a href="/ide" class="active">IDE</a>
      <a href="/docs">Docs</a>
    </div>
    <div style="margin-left:auto; display:flex; gap:8px;">
      <button onclick="runCode()">▶ Run</button>
      <button onclick="proveCode()">🔒 Prove</button>
    </div>
  </div>

  <div id="toolbar">
    <button class="active" onclick="togglePanel('editor-frame', this)">📝 Editor</button>
    <button class="active" onclick="togglePanel('repl-frame', this)">💻 REPL</button>
    <button class="active" onclick="togglePanel('debugger-frame', this)">🐞 Debugger</button>
    <button class="active" onclick="togglePanel('process-frame', this)">📊 Process</button>
  </div>

  <div id="workspace" class="layout-all">
    <iframe src="editor-frame.html" id="editor-frame"></iframe>
    <iframe src="debugger-frame.html" id="debugger-frame"></iframe>
    <iframe src="repl-frame.html" id="repl-frame"></iframe>
    <iframe src="process-frame.html" id="process-frame"></iframe>
  </div>

  <script src="wasm-core.js"></script>
  <script>
    console.log('IDE script loaded');
    // ═══════════════════════════════════════════
    // GESTION DES PANNEAUX
    // ═══════════════════════════════════════════
    function togglePanel(frameId, btn) {
      console.log('togglePanel', frameId, btn);
      const frame = document.getElementById(frameId);
      if (!frame) return;
      // basculer la visibilité
      frame.classList.toggle('hidden-panel');
      // basculer le style du bouton
      btn.classList.toggle('active');
      // recalculer la disposition de la grille
      updateLayout();
    }

    function updateLayout() {
      const editorVis = !document.getElementById('editor-frame').classList.contains('hidden-panel');
      const replVis = !document.getElementById('repl-frame').classList.contains('hidden-panel');
      const debugVis = !document.getElementById('debugger-frame').classList.contains('hidden-panel');
      const processVis = !document.getElementById('process-frame').classList.contains('hidden-panel');

      const ws = document.getElementById('workspace');
      // Réinitialiser toutes les classes de layout
      ws.className = '';

      // Construire la grille selon les panneaux visibles
      // On place les panneaux dans l'ordre : editor (0,0), repl (0,1), debugger (1,0), process (1,1)
      // Si un panneau est caché, on le retire de la grille en utilisant display:none déjà appliqué.
      // La grille doit s'adapter : on définit les colonnes/lignes en fonction de ce qui est visible.
      let cols = [];
      let rows = [];

      // Colonnes : on a besoin d'une colonne pour chaque "slot" occupé
      if (editorVis || debugVis) cols.push('2fr'); // colonne de gauche
      if (replVis || processVis) cols.push('1fr'); // colonne de droite

      // Lignes : ligne du haut si editor ou repl visible, ligne du bas si debug ou process visible
      if (editorVis || replVis) rows.push('1fr');
      if (debugVis || processVis) rows.push('1fr');

      // Si aucune colonne/ligne, on met tout à 1fr pour éviter une grille vide
      if (cols.length === 0) cols = ['1fr'];
      if (rows.length === 0) rows = ['1fr'];

      ws.style.gridTemplateColumns = cols.join(' ');
      ws.style.gridTemplateRows = rows.join(' ');
    }

    // ═══════════════════════════════════════════
    // COMMUNICATION AVEC L'ÉDITEUR ET LE REPL
    // ═══════════════════════════════════════════
    function postTo(frameId, msg) {
      const frame = document.getElementById(frameId);
      if (frame && frame.contentWindow) {
        frame.contentWindow.postMessage(msg, '*');
      }
    }

    function runCode() {
      console.log('ide.html runCode called');
      postTo('editor-frame', { type: 'run' });
    }

    function proveCode() {
      postTo('editor-frame', { type: 'prove' });
    }

    // ═══════════════════════════════════════════
    // ÉCOUTE DES MESSAGES (pour le statut, etc.)
    // ═══════════════════════════════════════════
    window.addEventListener('message', (e) => {
      if (e.data && e.data.text) console.log('[IDE MSG] ' + e.data.text);
      
        if (e.data && e.data.type === 'log') {
          console.log('[REPL] ' + e.data.text);
        } else if (e.data && e.data.type === 'repl-ready') {
          console.log('REPL is ready');
          document.getElementById('sb-wasm').textContent = 'wasm: REPL ready';
        }
        if (e.data && e.data.type === 'status') {
          console.log('REPL status is', e.data.text);
          document.getElementById('sb-wasm').textContent = e.data.text;
        }
      });

    // ═══════════════════════════════════════════
    // INITIALISATION
    // ═══════════════════════════════════════════
    updateLayout();
  </script>
</body>
</html>
